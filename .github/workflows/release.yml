name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit already reachable from main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match package.json version '${version}'." >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e

      - name: Package extension
        run: npx vsce package --out sass-scss-completion.vsix

      - name: Upload the packaged extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sass-scss-completion-vsix
          path: sass-scss-completion.vsix

      - name: Publish to the Marketplace
        run: npx vsce publish --packagePath sass-scss-completion.vsix --oidc
