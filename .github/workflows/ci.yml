name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install the plugin dependencies
        working-directory: packages/stylelint-plugin
        run: npm ci

      # `verify:example` lints a deliberately broken file, so it always ends on stylelint's exit
      # code 2 (errors found) and cannot be a CI step as it stands. The count is asserted instead,
      # which fails if the plugin stops loading or a rule stops reporting.
      - name: Check the plugin example reports every rule
        working-directory: packages/stylelint-plugin
        run: |
          npm run build
          npx stylelint "example/**/*.scss" --formatter json --output-file "$RUNNER_TEMP/example.json" || true
          node -e "const [report] = require(process.env.RUNNER_TEMP + '/example.json'); const count = report.warnings.length; if (count !== 5) { console.error('The example must report 5 problems, got ' + count); process.exit(1); }"
